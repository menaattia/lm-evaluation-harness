# Shared config for essay scoring tasks.
# Set data_files to the CSV produced by essay_scoring.py (absolute path recommended).
dataset_path: menaattia/essay_scoring_sample
test_split: test
doc_to_target: !function utils.doc_to_target
metric_list:
  - metric: pred_score
    aggregation: !function utils.mean_valid
    higher_is_better: true
  - metric: signed_dev
    aggregation: !function utils.mean_valid
    higher_is_better: false
  - metric: abs_dev
    aggregation: !function utils.mean_valid
    higher_is_better: false
  - metric: exact
    aggregation: !function utils.mean_valid
    higher_is_better: true
  - metric: valid
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
